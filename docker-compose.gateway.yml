services:
  foxos:
    environment:
      FOXOS_SECURE_COOKIE: "true"
      FOXOS_TRUST_PROXY: "1"

  foxos-gateway:
    build:
      context: ./gateway
      args:
        CADDY_VERSION: "2.11.4"
    container_name: foxos-gateway
    depends_on:
      foxos:
        condition: service_healthy
    ports:
      - "${FOXOS_HTTPS_BIND_ADDRESS:-0.0.0.0}:${FOXOS_HTTPS_PORT:-8443}:443/tcp"
    environment:
      FOXOS_DOMAIN: "${FOXOS_DOMAIN:?Set FOXOS_DOMAIN in .env}"
      FOXOS_ACME_EMAIL: "${FOXOS_ACME_EMAIL:?Set FOXOS_ACME_EMAIL in .env}"
    secrets:
      - cloudflare_api_token
    volumes:
      - type: bind
        source: ./.foxos-data/gateway/caddy-data
        target: /data
      - type: bind
        source: ./.foxos-data/gateway/caddy-config
        target: /config
    labels:
      com.foxos.core: "true"
      com.foxos.gateway: "true"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --quiet --spider --no-check-certificate
          https://127.0.0.1/api/health
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

secrets:
  cloudflare_api_token:
    file: ./.foxos-data/gateway/secrets/cloudflare-api-token
