name: FoxOS validation

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Test backend
        run: npm test
        working-directory: backend

      - name: Check backend syntax
        run: npm run check
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Validate Compose and installer
        run: |
          docker compose config --quiet
          docker compose -f pilot/docker-compose.adoption-lab.yml config --quiet
          bash -n install.sh
          bash -n install-gateway.sh
          sh -n gateway/entrypoint.sh
          mkdir -p .foxos-data/gateway/secrets .foxos-data/gateway/caddy-data .foxos-data/gateway/caddy-config
          touch .foxos-data/gateway/secrets/cloudflare-api-token
          FOXOS_DOMAIN=foxos.example.com \
          FOXOS_ACME_EMAIL=admin@example.com \
          docker compose -f docker-compose.yml -f docker-compose.gateway.yml config --quiet
          docker build --tag foxos-gateway-ci gateway
          docker run --rm --entrypoint caddy \
            -e FOXOS_DOMAIN=foxos.example.com \
            -e FOXOS_ACME_EMAIL=admin@example.com \
            -e CLOUDFLARE_API_TOKEN=0000000000000000000000000000000000000000 \
            foxos-gateway-ci validate --config /etc/caddy/Caddyfile --adapter caddyfile
