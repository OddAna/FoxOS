name: FoxOS validation

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Test backend
        run: npm test
        working-directory: backend

      - name: Check backend syntax
        run: npm run check
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Validate Compose and installer
        run: |
          docker compose config --quiet
          if docker compose config | grep -Eiq 'cloudflare|s3-compatible|r2[._-]'; then
            echo 'Base Compose unexpectedly contains an external provider dependency.' >&2
            exit 1
          fi
          if grep -Eiq 'cloudflare|configure-s3|install-gateway' install.sh; then
            echo 'Base installer unexpectedly invokes an external provider adapter.' >&2
            exit 1
          fi
          FOXOS_PILOT_TOKEN=ci-disposable-placeholder \
            docker compose -f pilot/docker-compose.adoption-lab.yml config --quiet
          bash -n install.sh
          bash -n install-gateway.sh
          sh -n gateway/entrypoint.sh
          mkdir -p .foxos-data/gateway/secrets .foxos-data/gateway/caddy-data .foxos-data/gateway/caddy-config
          touch .foxos-data/gateway/secrets/cloudflare-api-token
          FOXOS_DOMAIN=foxos.example.com \
          FOXOS_ACME_EMAIL=admin@example.com \
          docker compose -f docker-compose.yml -f docker-compose.gateway.yml config --quiet
          docker build --tag foxos-gateway-ci gateway
          docker run --rm --entrypoint caddy \
            -e FOXOS_DOMAIN=foxos.example.com \
            -e FOXOS_ACME_EMAIL=admin@example.com \
            -e CLOUDFLARE_API_TOKEN=0000000000000000000000000000000000000000 \
            foxos-gateway-ci validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Verify clean base install without external providers
        run: |
          cleanup() {
            container_ids=$(docker ps -aq --filter label=com.foxos.deployment.disposable=true)
            if [ -n "$container_ids" ]; then docker rm -f $container_ids; fi
            image_ids=$(docker images -q --filter label=com.foxos.deployment.disposable=true)
            if [ -n "$image_ids" ]; then docker image rm -f $image_ids; fi
            docker compose down
          }
          trap cleanup EXIT
          test ! -e .env
          ./install.sh
          for attempt in $(seq 1 30); do
            state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' foxos)
            if [ "$state" = healthy ]; then
              break
            fi
            sleep 2
          done
          test "$state" = healthy
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health >/dev/null
          docker compose exec -T foxos node /app/recoveryCli.js status | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const status = JSON.parse(input);
              if (status.backup.configured || status.backup.ready || status.backup.adapter) process.exit(1);
            });
          '

          plan_v1=$(docker compose exec -T foxos node /app/deploymentCli.js plan \
            --repository https://github.com/OddAna/FoxOS.git \
            --ref develop \
            --context pilot/source-deployment-canary/v1 \
            --dockerfile Dockerfile \
            --private-port 8080 \
            --health-path / \
            --expected-body "FoxOS source deployment canary v1" \
            --confirm "PLAN DISPOSABLE SOURCE")
          plan_v1_id=$(printf '%s' "$plan_v1" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).planId))')
          plan_v1_revision=$(printf '%s' "$plan_v1" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).revisionId))')
          operation_v1=$(docker compose exec -T foxos node /app/deploymentCli.js apply "$plan_v1_id" \
            --confirm "DEPLOY DISPOSABLE $plan_v1_id")
          printf '%s' "$operation_v1" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{if(JSON.parse(s).status!=="applied")process.exit(1)})'

          plan_v2=$(docker compose exec -T foxos node /app/deploymentCli.js plan \
            --repository https://github.com/OddAna/FoxOS.git \
            --ref develop \
            --context pilot/source-deployment-canary/v2 \
            --dockerfile Dockerfile \
            --private-port 8080 \
            --health-path / \
            --expected-body "FoxOS source deployment canary v2" \
            --confirm "PLAN DISPOSABLE SOURCE")
          plan_v2_id=$(printf '%s' "$plan_v2" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).planId))')
          operation_v2=$(docker compose exec -T foxos node /app/deploymentCli.js apply "$plan_v2_id" \
            --confirm "DEPLOY DISPOSABLE $plan_v2_id")
          operation_v2_id=$(printf '%s' "$operation_v2" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).operationId))')
          docker compose exec -T foxos node /app/deploymentCli.js rollback "$operation_v2_id" \
            --confirm "ROLLBACK DEPLOYMENT $operation_v2_id" >/dev/null
          deployment_status=$(docker compose exec -T foxos node /app/deploymentCli.js status)
          deployment_revision=$(printf '%s' "$deployment_status" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).current.revisionId))')
          test "$deployment_revision" = "$plan_v1_revision"
          deployment_port=$(printf '%s' "$deployment_status" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(String(JSON.parse(s).current.hostPort)))')
          curl --fail --silent --show-error "http://127.0.0.1:$deployment_port/" | grep -F "FoxOS source deployment canary v1" >/dev/null
